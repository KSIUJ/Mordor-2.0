<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KSI staż{% endblock %}</title>

    <script
        src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
        crossorigin="anonymous">
    </script>


    <link rel="stylesheet" href="//cdn.datatables.net/2.3.3/css/dataTables.dataTables.min.css" />
    <link href="https://cdn.datatables.net/columncontrol/1.0.7/css/columnControl.dataTables.min.css" rel="stylesheet">
    <link rel="stylesheet" href="//cdn.datatables.net/responsive/3.0.6/css/responsive.dataTables.min.css" />

    <script src="//cdn.datatables.net/2.3.3/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/columncontrol/1.0.7/js/dataTables.columnControl.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.6/js/dataTables.responsive.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <style>
        body {
            background-color: #EAE4D5;
            padding: 20px;
        }
        form {
            margin: 0 auto;
            padding: 20px;
            background-color: #F2F2F2;
        }
        #addTagBtn{
            background-color: #B6B09F;
            border-color: #756F60;
        }
        #addTagBtn:hover{
            background-color: #756F60;
        }
        .tag-badge {
          background-color: #756F60;
          color: white;
        }
        .form-label{
            margin-right: 20px;
        }
        .btn-success{
            margin-top: 40px;
        }
    </style>
    {% block head %} {% endblock %}
</head>
<body>
    {% include "navbar.html" %}

    <main>
        {% block content %}
        <h1>Welcome to KSI</h1>
        <p>KSI is the best</p>
        {% endblock %}
    </main>

    {% include "footer.html" %}
</body>
</html>
